[versions]
spring-boot = "4.1.1"
aws-sdk = "2.55.14"
# Overrides the Jackson 3.1.5 managed by Spring Boot 4.1.1 (fixable HIGH CVEs: CVE-2026-89407, CVE-2026-89425,
# CVE-2026-68497, CVE-2026-91776, CVE-2026-91777); drop once the Boot BOM manages >= 3.1.7.
jackson = "3.1.7"
resilience4j = "2.4.0"
bucket4j = "8.21.0"
archunit = "1.5.1"
jacoco = "0.8.15"
testcontainers = "2.0.5"
mockwebserver = "5.5.0"
lombok = "1.18.48"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }

spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }

aws-dynamodb = { module = "software.amazon.awssdk:dynamodb" }
aws-dynamodb-enhanced = { module = "software.amazon.awssdk:dynamodb-enhanced" }
aws-sqs = { module = "software.amazon.awssdk:sqs" }
aws-netty-nio-client = { module = "software.amazon.awssdk:netty-nio-client" }
aws-sts = { module = "software.amazon.awssdk:sts" }

resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-micrometer = { module = "io.github.resilience4j:resilience4j-micrometer", version.ref = "resilience4j" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
reactor-test = { module = "io.projectreactor:reactor-test" }
mockito-core = { module = "org.mockito:mockito-core" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "mockwebserver" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack" }
awaitility = { module = "org.awaitility:awaitility" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

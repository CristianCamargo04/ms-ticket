# Single configuration file. The first document holds the common settings; the documents below it are activated by
# profile (spring.config.activate.on-profile): local (docker compose / IDE), ci (Testcontainers) and prod (AWS ECS).
# No credentials anywhere: the AWS SDK uses DefaultCredentialsProvider (environment variables locally,
# IAM task role in AWS) and JWTs are validated against the issuer's JWKS.

spring:
  application:
    name: ms-ticket
  main:
    banner-mode: off
  web:
    resources:
      # Pure JSON API: no static resource handler, so unknown routes are plain 404 problem details.
      add-mappings: false
  threads:
    virtual:
      # Only affects Spring-managed task executors (scheduling / residual blocking work), never the WebFlux
      # request path (see ADR-009).
      enabled: true
  lifecycle:
    # Graceful shutdown budget: in-flight HTTP requests and SQS messages are drained before stopping.
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

info:
  application:
    name: ${spring.application.name}

logging:
  level:
    root: INFO
    com.ticketing: INFO

ticketing:
  runtime-mode: all
  orders:
    hold-ttl: 10m
    confirmation-timeout: 5m
    republish-after: 30s
    max-tickets-per-order: 10
    # DynamoDB transactions allow 100 items and a command writes 2n + 2 of them.
    max-complimentary-per-request: 40
    candidate-factor: 3
  events:
    max-capacity: 20000
    availability-stream-interval: 1s
    ticket-write-concurrency: 4
  cache:
    event-ttl: 2s
    event-max-size: 10000
  sweeper:
    interval: 15s
    lease: 30s
    batch-size: 100
    concurrency: 8
  retry:
    inventory:
      max-attempts: 6
      min-backoff: 25ms
      max-backoff: 1s
      jitter: 0.5
    publish:
      max-attempts: 3
      min-backoff: 100ms
      max-backoff: 1s
      jitter: 0.5
  rate-limit:
    enabled: true
    capacity: 20
    refill-tokens: 20
    refill-period: 1s
  messaging:
    max-messages: 10
    wait-time-seconds: 20
    visibility-timeout-seconds: 60
    concurrency: 16
    pollers: 2
  payment:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
    connect-timeout: 1s
    response-timeout: 3s
    call-timeout: 4s
    max-retries: 2
    retry-backoff: 100ms
  security:
    audience: ${JWT_AUDIENCE:ms-ticket}
    issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    roles-claim: roles
  migrations:
    enabled: false

aws:
  region: ${AWS_REGION:us-east-1}
  # Optional per-service endpoint overrides (DynamoDB Local / LocalStack); only set in the local and ci profiles below:
  # endpoint-override:
  #   dynamodb-endpoint: http://localhost:8000
  #   sqs-endpoint: http://localhost:4566
  dynamodb:
    tables:
      events: ticketing-events
      tickets: ticketing-tickets
      orders: ticketing-orders
      ticket-transitions: ticketing-ticket-transitions
      distributed-locks: ticketing-distributed-locks
      schema-migrations: ticketing-schema-migrations
    deadline-shards: 8
  sqs:
    order-reservation-queue: ticketing-order-reservation
    order-payment-queue: ticketing-order-payment

---
# ===================================================================== profile: local
spring.config.activate.on-profile: local

# Local development: DynamoDB Local, LocalStack (SQS), WireMock payment gateway and mock-oauth2-server.
# AWS credentials come from the environment (e.g. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY dummies in .env);
# nothing secret is stored here. Plain-text console logs (no structured logging).

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ticketing: DEBUG

ticketing:
  runtime-mode: ${TICKETING_RUNTIME_MODE:all}
  payment:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
  security:
    issuer: ${JWT_ISSUER_URI:http://localhost:8090/default}
  migrations:
    enabled: true

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override:
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    sqs-endpoint: ${SQS_ENDPOINT:http://localhost:4566}

---
# ===================================================================== profile: ci
spring.config.activate.on-profile: ci

# Continuous integration (integration tests with Testcontainers). Container endpoints and the JWT issuer are
# usually injected at runtime (@DynamicPropertySource); the environment placeholders below are the fallback.
# Table and queue names keep the defaults of application.yml.

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  structured:
    format:
      console: ecs

ticketing:
  runtime-mode: ${TICKETING_RUNTIME_MODE:all}
  payment:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
  security:
    issuer: ${JWT_ISSUER_URI:http://localhost:8090/default}
  migrations:
    enabled: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override:
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    sqs-endpoint: ${SQS_ENDPOINT:http://localhost:4566}

---
# ===================================================================== profile: prod
spring.config.activate.on-profile: prod

# AWS production (ECS Fargate). Every environment-specific value comes from environment variables injected by the
# task definition; values without a default are mandatory (startup fails fast when they are missing).
# Credentials come from the IAM task role; secrets, if any, from Secrets Manager. Migrations are owned by Terraform.
# Placeholders read the variable names the Terraform task definitions inject (infra/terraform/envs/*/main.tf, the
# relaxed-binding names such as TICKETING_SECURITY_ISSUER or AWS_DYNAMODB_TABLES_EVENTS), with the older short names
# (JWT_ISSUER_URI, DYNAMODB_TABLE_EVENTS, ...) as fallbacks. Every placeholder must resolve with Terraform's variables
# alone: Spring Boot evaluates some of these keys strictly at startup (e.g. the issuer-uri auto-configuration
# condition), so an unresolvable one aborts the context.

management:
  # Actuator on its own port (ALB target-group health checks, in-VPC scrapers): it is never served on the
  # business port, and the ALB listener only forwards client traffic to 8080. The security chain also applies to
  # the management server (its child context inherits the WebFilters), so /actuator/health/** stays public there.
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ticketing: ${LOG_LEVEL_APP:INFO}

server:
  port: ${SERVER_PORT:8080}
  # TLS terminates at the ALB: Reactor Netty derives the request scheme/host from X-Forwarded-Proto/-Host, so
  # generated URLs are https. Client IPs are NOT taken from here (Netty uses the first, spoofable X-Forwarded-For
  # hop): RequestContextResolverImpl reads the rightmost hop, the one appended by the ALB.
  forward-headers-strategy: native

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TICKETING_SECURITY_ISSUER:${JWT_ISSUER_URI}}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI:${JWT_JWK_SET_URI}}

ticketing:
  runtime-mode: ${TICKETING_RUNTIMEMODE:${TICKETING_RUNTIME_MODE}}
  orders:
    hold-ttl: ${TICKETING_HOLD_TTL:10m}
    confirmation-timeout: ${TICKETING_CONFIRMATION_TIMEOUT:5m}
    max-tickets-per-order: ${TICKETING_MAX_TICKETS_PER_ORDER:10}
  events:
    max-capacity: ${TICKETING_MAX_CAPACITY:20000}
  rate-limit:
    enabled: ${TICKETING_RATE_LIMIT_ENABLED:true}
    capacity: ${TICKETING_RATE_LIMIT_CAPACITY:20}
    refill-tokens: ${TICKETING_RATE_LIMIT_REFILL_TOKENS:20}
  messaging:
    concurrency: ${TICKETING_MESSAGING_CONCURRENCY:16}
    pollers: ${TICKETING_MESSAGING_POLLERS:2}
  payment:
    base-url: ${TICKETING_PAYMENT_BASEURL:${PAYMENT_GATEWAY_BASE_URL}}
    # api-key is bound from TICKETING_PAYMENT_APIKEY (Secrets Manager); deliberately not declared here.
  security:
    audience: ${TICKETING_SECURITY_AUDIENCE:${JWT_AUDIENCE}}
    issuer: ${TICKETING_SECURITY_ISSUER:${JWT_ISSUER_URI}}
  migrations:
    enabled: false

aws:
  region: ${AWS_REGION}
  dynamodb:
    tables:
      events: ${AWS_DYNAMODB_TABLES_EVENTS:${DYNAMODB_TABLE_EVENTS}}
      tickets: ${AWS_DYNAMODB_TABLES_TICKETS:${DYNAMODB_TABLE_TICKETS}}
      orders: ${AWS_DYNAMODB_TABLES_ORDERS:${DYNAMODB_TABLE_ORDERS}}
      ticket-transitions: ${AWS_DYNAMODB_TABLES_TICKETTRANSITIONS:${DYNAMODB_TABLE_TICKET_TRANSITIONS}}
      distributed-locks: ${AWS_DYNAMODB_TABLES_DISTRIBUTEDLOCKS:${DYNAMODB_TABLE_DISTRIBUTED_LOCKS}}
      schema-migrations: ${AWS_DYNAMODB_TABLES_SCHEMAMIGRATIONS:${DYNAMODB_TABLE_SCHEMA_MIGRATIONS:ticketing-prod-schema-migrations}}
    deadline-shards: ${DYNAMODB_DEADLINE_SHARDS:8}
  sqs:
    order-reservation-queue: ${AWS_SQS_ORDERRESERVATIONQUEUE:${SQS_ORDER_RESERVATION_QUEUE}}
    order-payment-queue: ${AWS_SQS_ORDERPAYMENTQUEUE:${SQS_ORDER_PAYMENT_QUEUE}}

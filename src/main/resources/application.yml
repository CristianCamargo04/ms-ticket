spring:
  application:
    name: ms-ticket
  main:
    banner-mode: off
  web:
    resources:
      add-mappings: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

info:
  application:
    name: ${spring.application.name}

logging:
  level:
    root: INFO
    com.ticketing: INFO

ticketing:
  runtime-mode: all
  orders:
    hold-ttl: 10m
    confirmation-timeout: 5m
    republish-after: 30s
    max-tickets-per-order: 10
    max-complimentary-per-request: 40
    candidate-factor: 3
  events:
    max-capacity: 20000
    availability-stream-interval: 1s
    ticket-write-concurrency: 4
  cache:
    event-ttl: 2s
    event-max-size: 10000
  sweeper:
    interval: 15s
    lease: 30s
    batch-size: 100
    concurrency: 8
  retry:
    inventory:
      max-attempts: 6
      min-backoff: 25ms
      max-backoff: 1s
      jitter: 0.5
    publish:
      max-attempts: 3
      min-backoff: 100ms
      max-backoff: 1s
      jitter: 0.5
  rate-limit:
    enabled: true
    capacity: 20
    refill-tokens: 20
    refill-period: 1s
  messaging:
    max-messages: 10
    wait-time-seconds: 20
    visibility-timeout-seconds: 60
    concurrency: 16
    pollers: 2
  payment:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
    connect-timeout: 1s
    response-timeout: 3s
    call-timeout: 4s
    max-retries: 2
    retry-backoff: 100ms
  security:
    audience: ${JWT_AUDIENCE:ms-ticket}
    issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    roles-claim: roles
  migrations:
    enabled: false

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    tables:
      events: ticketing-events
      tickets: ticketing-tickets
      orders: ticketing-orders
      ticket-transitions: ticketing-ticket-transitions
      distributed-locks: ticketing-distributed-locks
      schema-migrations: ticketing-schema-migrations
    deadline-shards: 8
  sqs:
    order-reservation-queue: ticketing-order-reservation
    order-payment-queue: ticketing-order-payment

---
spring.config.activate.on-profile: local

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ticketing: DEBUG

ticketing:
  runtime-mode: ${TICKETING_RUNTIME_MODE:all}
  payment:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
  security:
    issuer: ${JWT_ISSUER_URI:http://localhost:8090/default}
  migrations:
    enabled: true

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override:
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    sqs-endpoint: ${SQS_ENDPOINT:http://localhost:4566}

---
spring.config.activate.on-profile: ci

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  structured:
    format:
      console: ecs

ticketing:
  runtime-mode: ${TICKETING_RUNTIME_MODE:all}
  payment:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
  security:
    issuer: ${JWT_ISSUER_URI:http://localhost:8090/default}
  migrations:
    enabled: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override:
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    sqs-endpoint: ${SQS_ENDPOINT:http://localhost:4566}

---
spring.config.activate.on-profile: prod

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ticketing: ${LOG_LEVEL_APP:INFO}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TICKETING_SECURITY_ISSUER:${JWT_ISSUER_URI}}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI:${JWT_JWK_SET_URI}}

ticketing:
  runtime-mode: ${TICKETING_RUNTIMEMODE:${TICKETING_RUNTIME_MODE}}
  orders:
    hold-ttl: ${TICKETING_HOLD_TTL:10m}
    confirmation-timeout: ${TICKETING_CONFIRMATION_TIMEOUT:5m}
    max-tickets-per-order: ${TICKETING_MAX_TICKETS_PER_ORDER:10}
  events:
    max-capacity: ${TICKETING_MAX_CAPACITY:20000}
  rate-limit:
    enabled: ${TICKETING_RATE_LIMIT_ENABLED:true}
    capacity: ${TICKETING_RATE_LIMIT_CAPACITY:20}
    refill-tokens: ${TICKETING_RATE_LIMIT_REFILL_TOKENS:20}
  messaging:
    concurrency: ${TICKETING_MESSAGING_CONCURRENCY:16}
    pollers: ${TICKETING_MESSAGING_POLLERS:2}
  payment:
    base-url: ${TICKETING_PAYMENT_BASEURL:${PAYMENT_GATEWAY_BASE_URL}}
  security:
    audience: ${TICKETING_SECURITY_AUDIENCE:${JWT_AUDIENCE}}
    issuer: ${TICKETING_SECURITY_ISSUER:${JWT_ISSUER_URI}}
  migrations:
    enabled: false

aws:
  region: ${AWS_REGION}
  dynamodb:
    tables:
      events: ${AWS_DYNAMODB_TABLES_EVENTS:${DYNAMODB_TABLE_EVENTS}}
      tickets: ${AWS_DYNAMODB_TABLES_TICKETS:${DYNAMODB_TABLE_TICKETS}}
      orders: ${AWS_DYNAMODB_TABLES_ORDERS:${DYNAMODB_TABLE_ORDERS}}
      ticket-transitions: ${AWS_DYNAMODB_TABLES_TICKETTRANSITIONS:${DYNAMODB_TABLE_TICKET_TRANSITIONS}}
      distributed-locks: ${AWS_DYNAMODB_TABLES_DISTRIBUTEDLOCKS:${DYNAMODB_TABLE_DISTRIBUTED_LOCKS}}
      schema-migrations: ${AWS_DYNAMODB_TABLES_SCHEMAMIGRATIONS:${DYNAMODB_TABLE_SCHEMA_MIGRATIONS:ticketing-prod-schema-migrations}}
    deadline-shards: ${DYNAMODB_DEADLINE_SHARDS:8}
  sqs:
    order-reservation-queue: ${AWS_SQS_ORDERRESERVATIONQUEUE:${SQS_ORDER_RESERVATION_QUEUE}}
    order-payment-queue: ${AWS_SQS_ORDERPAYMENTQUEUE:${SQS_ORDER_PAYMENT_QUEUE}}

# AWS production (ECS Fargate). Every environment-specific value comes from environment variables injected by the
# task definition; values without a default are mandatory (startup fails fast when they are missing).
# Credentials come from the IAM task role; secrets, if any, from Secrets Manager. Migrations are owned by Terraform.
# Placeholders read the variable names the Terraform task definitions inject (infra/terraform/envs/*/main.tf, the
# relaxed-binding names such as TICKETING_SECURITY_ISSUER or AWS_DYNAMODB_TABLES_EVENTS), with the older short names
# (JWT_ISSUER_URI, DYNAMODB_TABLE_EVENTS, ...) as fallbacks. Every placeholder must resolve with Terraform's variables
# alone: Spring Boot evaluates some of these keys strictly at startup (e.g. the issuer-uri auto-configuration
# condition), so an unresolvable one aborts the context.

management:
  # Actuator on its own port (ALB target-group health checks, in-VPC scrapers): it is never served on the
  # business port, and the ALB listener only forwards client traffic to 8080. The security chain also applies to
  # the management server (its child context inherits the WebFilters), so /actuator/health/** stays public there.
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ticketing: ${LOG_LEVEL_APP:INFO}

server:
  port: ${SERVER_PORT:8080}
  # TLS terminates at the ALB: Reactor Netty derives the request scheme/host from X-Forwarded-Proto/-Host, so
  # generated URLs are https. Client IPs are NOT taken from here (Netty uses the first, spoofable X-Forwarded-For
  # hop): RequestContextResolverImpl reads the rightmost hop, the one appended by the ALB.
  forward-headers-strategy: native

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${TICKETING_SECURITY_ISSUER:${JWT_ISSUER_URI}}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI:${JWT_JWK_SET_URI}}

ticketing:
  runtime-mode: ${TICKETING_RUNTIMEMODE:${TICKETING_RUNTIME_MODE}}
  orders:
    hold-ttl: ${TICKETING_HOLD_TTL:10m}
    confirmation-timeout: ${TICKETING_CONFIRMATION_TIMEOUT:5m}
    max-tickets-per-order: ${TICKETING_MAX_TICKETS_PER_ORDER:10}
  events:
    max-capacity: ${TICKETING_MAX_CAPACITY:20000}
  rate-limit:
    enabled: ${TICKETING_RATE_LIMIT_ENABLED:true}
    capacity: ${TICKETING_RATE_LIMIT_CAPACITY:20}
    refill-tokens: ${TICKETING_RATE_LIMIT_REFILL_TOKENS:20}
  messaging:
    concurrency: ${TICKETING_MESSAGING_CONCURRENCY:16}
    pollers: ${TICKETING_MESSAGING_POLLERS:2}
  payment:
    base-url: ${TICKETING_PAYMENT_BASEURL:${PAYMENT_GATEWAY_BASE_URL}}
    # api-key is bound from TICKETING_PAYMENT_APIKEY (Secrets Manager); deliberately not declared here.
  security:
    audience: ${TICKETING_SECURITY_AUDIENCE:${JWT_AUDIENCE}}
    issuer: ${TICKETING_SECURITY_ISSUER:${JWT_ISSUER_URI}}
  migrations:
    enabled: false

aws:
  region: ${AWS_REGION}
  dynamodb:
    tables:
      events: ${AWS_DYNAMODB_TABLES_EVENTS:${DYNAMODB_TABLE_EVENTS}}
      tickets: ${AWS_DYNAMODB_TABLES_TICKETS:${DYNAMODB_TABLE_TICKETS}}
      orders: ${AWS_DYNAMODB_TABLES_ORDERS:${DYNAMODB_TABLE_ORDERS}}
      ticket-transitions: ${AWS_DYNAMODB_TABLES_TICKETTRANSITIONS:${DYNAMODB_TABLE_TICKET_TRANSITIONS}}
      distributed-locks: ${AWS_DYNAMODB_TABLES_DISTRIBUTEDLOCKS:${DYNAMODB_TABLE_DISTRIBUTED_LOCKS}}
      schema-migrations: ${AWS_DYNAMODB_TABLES_SCHEMAMIGRATIONS:${DYNAMODB_TABLE_SCHEMA_MIGRATIONS:ticketing-prod-schema-migrations}}
    deadline-shards: ${DYNAMODB_DEADLINE_SHARDS:8}
  sqs:
    order-reservation-queue: ${AWS_SQS_ORDERRESERVATIONQUEUE:${SQS_ORDER_RESERVATION_QUEUE}}
    order-payment-queue: ${AWS_SQS_ORDERPAYMENTQUEUE:${SQS_ORDER_PAYMENT_QUEUE}}

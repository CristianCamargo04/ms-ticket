# Continuous integration (integration tests with Testcontainers). Container endpoints and the JWT issuer are
# usually injected at runtime (@DynamicPropertySource); the environment placeholders below are the fallback.
# Table and queue names keep the defaults of application.yml.

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  structured:
    format:
      console: ecs

ticketing:
  runtime-mode: ${TICKETING_RUNTIME_MODE:all}
  payment:
    base-url: ${PAYMENT_GATEWAY_BASE_URL:http://localhost:8089}
  security:
    issuer: ${JWT_ISSUER_URI:http://localhost:8090/default}
  migrations:
    enabled: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override:
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    sqs-endpoint: ${SQS_ENDPOINT:http://localhost:4566}
